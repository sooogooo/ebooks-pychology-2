{% extends "base.html" %}

{% block content %}
  {{ super() }}
  
  <!-- Custom JavaScript for enhanced functionality -->
  <script>
    // Add reading progress indicator
    window.addEventListener('scroll', function() {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      
      let progressBar = document.getElementById('reading-progress');
      if (!progressBar) {
        progressBar = document.createElement('div');
        progressBar.id = 'reading-progress';
        progressBar.style.cssText = `
          position: fixed;
          top: 0;
          left: 0;
          width: ${scrolled}%;
          height: 3px;
          background: var(--md-primary-fg-color);
          z-index: 1000;
          transition: width 0.1s ease;
        `;
        document.body.appendChild(progressBar);
      } else {
        progressBar.style.width = scrolled + '%';
      }
    });

    // Add smooth scrolling for anchor links
    document.addEventListener('DOMContentLoaded', function() {
      const links = document.querySelectorAll('a[href^="#"]');
      links.forEach(link => {
        link.addEventListener('click', function(e) {
          e.preventDefault();
          const target = document.querySelector(this.getAttribute('href'));
          if (target) {
            target.scrollIntoView({
              behavior: 'smooth',
              block: 'start'
            });
          }
        });
      });
    });

    // Add copy button to code blocks
    document.addEventListener('DOMContentLoaded', function() {
      const codeBlocks = document.querySelectorAll('pre code');
      codeBlocks.forEach(function(block) {
        const button = document.createElement('button');
        button.className = 'copy-button';
        button.textContent = '复制';
        button.style.cssText = `
          position: absolute;
          top: 8px;
          right: 8px;
          padding: 4px 8px;
          background: var(--md-primary-fg-color);
          color: var(--md-primary-bg-color);
          border: none;
          border-radius: 4px;
          font-size: 12px;
          cursor: pointer;
          opacity: 0.7;
          transition: opacity 0.2s;
        `;
        
        button.addEventListener('click', function() {
          navigator.clipboard.writeText(block.textContent).then(function() {
            button.textContent = '已复制!';
            setTimeout(function() {
              button.textContent = '复制';
            }, 2000);
          });
        });
        
        const pre = block.parentElement;
        pre.style.position = 'relative';
        pre.appendChild(button);
        
        pre.addEventListener('mouseenter', function() {
          button.style.opacity = '1';
        });
        
        pre.addEventListener('mouseleave', function() {
          button.style.opacity = '0.7';
        });
      });
    });
  </script>
{% endblock %}

{% block styles %}
  {{ super() }}
  <style>
    /* Custom styles for enhanced reading experience */
    .md-content__inner {
      margin: 0 auto;
      max-width: 800px;
    }
    
    /* Improve chapter navigation */
    .chapter-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2rem 0;
      padding: 1rem;
      background: var(--md-code-bg-color);
      border-radius: 8px;
      border-left: 4px solid var(--md-primary-fg-color);
    }
    
    .chapter-nav a {
      display: inline-flex;
      align-items: center;
      padding: 0.5rem 1rem;
      background: var(--md-primary-fg-color);
      color: var(--md-primary-bg-color);
      text-decoration: none;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    
    .chapter-nav a:hover {
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    
    /* Enhance admonitions */
    .md-typeset .admonition.case-study {
      border-left-color: #ff9800;
    }
    
    .md-typeset .admonition.case-study > .admonition-title {
      background-color: rgba(255, 152, 0, 0.1);
    }
    
    .md-typeset .admonition.case-study > .admonition-title::before {
      background-color: #ff9800;
      mask-image: var(--md-admonition-icon--example);
    }
    
    /* Reading progress bar */
    #reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: var(--md-primary-fg-color);
      z-index: 1000;
      transition: width 0.1s ease;
    }
    
    /* Responsive improvements */
    @media screen and (max-width: 768px) {
      .chapter-nav {
        flex-direction: column;
        gap: 0.5rem;
      }
      
      .chapter-nav a {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
{% endblock %}
