site_name: Psychological Manipulation 2.0 - The Art of Recognition and Counter-Defense
site_description: A comprehensive guide to understanding psychological manipulation in medical aesthetics
site_author: Your Name
site_url: https://your-domain.com

theme:
  name: material
  language: zh
  custom_dir: overrides
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit
    - content.action.view
    - navigation.footer
  font:
    text: Noto Sans SC
    code: Roboto Mono
  extra_css:
    - stylesheets/extra.css

plugins:
  - search:
      lang: zh
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - toc:
      permalink: true
  - footnotes
  - tables

nav:
  - 首页: index.md
  - 引言: 00-introduction.md
  - 理论基础:
    - 美学哲学基础: 01-beauty-philosophy.md
    - 科学思维应用: 02-scientific-thinking.md
    - 美的测量: 03-measuring-beauty.md
    - 文化建构: 04-cultural-construction.md
  - 心理机制:
    - 数字镜像: 05-digital-mirror.md
    - 人格滤镜: 06-personality-filters.md
    - 身体意象: 07-body-image.md
    - 亲密关系: 08-intimate-relationships.md
  - 决策与社会:
    - 认知陷阱: 09-cognitive-biases.md
    - 群体力量: 10-social-psychology.md
    - 伦理边界: 11-ethics-boundaries.md
  - 未来展望:
    - 技术革新: 12-future-trends.md
    - 结语: 13-conclusion.md
  - 附录:
    - 写作计划: writing_plan.md
    - 完成总结: writing_plan_final.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-username
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/your-username

copyright: Copyright &copy; 2024 Your Name. All rights reserved.