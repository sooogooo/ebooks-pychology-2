site_name: 医美消费心理学
site_description: 深度解析医美消费背后的心理机制与决策过程
site_author: Your Name
site_url: https://your-domain.com

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - search.suggest
    - content.code.copy
    - content.tabs.link
    - toc.follow
    - toc.integrate
  
  font:
    text: Noto Sans SC
    code: Roboto Mono

plugins:
  - search:
      lang: 
        - zh
        - en
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: 目录

nav:
  - 首页: index.md
  - 引言: 00-introduction.md
  - 理论基础:
    - 美学哲学基础: 01-beauty-philosophy.md
    - 科学思维应用: 02-scientific-thinking.md
    - 美的测量: 03-measuring-beauty.md
    - 文化建构: 04-cultural-construction.md
  - 心理机制:
    - 数字镜像: 05-digital-mirror.md
    - 人格滤镜: 06-personality-filters.md
    - 身体意象: 07-body-image.md
    - 亲密关系: 08-intimate-relationships.md
  - 决策与社会:
    - 认知陷阱: 09-cognitive-biases.md
    - 群体力量: 10-social-psychology.md
    - 伦理边界: 11-ethics-boundaries.md
  - 未来展望:
    - 技术革新: 12-future-trends.md
    - 结语: 13-conclusion.md
  - 附录:
    - 写作计划: writing_plan.md
    - 完成总结: book_completion_summary.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-username
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/your-username

extra_css:
  - stylesheets/extra.css
  - stylesheets/enhanced.css

extra_javascript:
  - javascripts/enhanced.js

